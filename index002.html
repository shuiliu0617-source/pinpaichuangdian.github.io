<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf7ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>成长积分银行</title>
<style>
:root{
  --bg0:#fdf7ea; --bg1:#eef5fd;
  --card:#ffffff;
  --line:rgba(70,76,110,.1);
  --ink:#33395e; --muted:#8a90ad;
  --gold:#f5a300; --gold2:#ff9210;
  --green:#2bb673; --red:#e05252;
  --c-study:#2f8fe0; --c-manner:#e85a9c; --c-friend:#23b573; --c-chore:#f08c1a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:var(--bg0); color:var(--ink); min-height:100vh; line-height:1.5;
  overscroll-behavior-y:none;
}
#stars{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(3px 3px at 12% 22%,rgba(245,170,40,.28),transparent 50%),
  radial-gradient(2.5px 2.5px at 30% 64%,rgba(47,143,224,.22),transparent 50%),
  radial-gradient(3px 3px at 47% 12%,rgba(232,90,156,.2),transparent 50%),
  radial-gradient(2.5px 2.5px at 62% 42%,rgba(35,181,115,.22),transparent 50%),
  radial-gradient(3px 3px at 76% 18%,rgba(245,170,40,.25),transparent 50%),
  radial-gradient(2.5px 2.5px at 88% 56%,rgba(47,143,224,.18),transparent 50%),
  radial-gradient(3px 3px at 18% 86%,rgba(232,90,156,.16),transparent 50%),
  radial-gradient(2.5px 2.5px at 68% 84%,rgba(35,181,115,.18),transparent 50%),
  radial-gradient(circle at 85% -12%,rgba(255,205,90,.45),transparent 52%),
  radial-gradient(circle at -12% 96%,rgba(150,200,255,.35),transparent 50%),
  linear-gradient(180deg,#fdf7ea 0%,#f4f8fd 55%,#fdf6e8 100%);
}
.app{display:block}
main{max-width:560px;margin:0 auto;padding:16px 14px calc(104px + env(safe-area-inset-bottom))}
.view{display:none}
.view.active{display:block;animation:fadeUp .28s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== 卡片与通用 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 6px 20px rgba(190,160,100,.14)}
.h2{font-size:17px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.h2 .sub{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.flab{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px;font-weight:600}
input,select,textarea{
  width:100%;background:#f7f5ee;border:1px solid rgba(70,76,110,.16);
  border-radius:12px;color:var(--ink);padding:11px 12px;font-size:15px;font-family:inherit;outline:none;
}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
select option{background:#ffffff;color:var(--ink)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:none;border-radius:13px;padding:11px 16px;font-size:14.5px;font-weight:800;
  font-family:inherit;cursor:pointer;transition:transform .12s ease,opacity .15s;white-space:nowrap;
}
.btn:active{transform:scale(.95)}
.btn-gold{background:linear-gradient(135deg,#ffd34d,#ff9b13);color:#5a3600;box-shadow:0 5px 16px rgba(255,160,30,.35)}
.btn-ghost{background:#f2f0e7;color:#565d84;border:1px solid rgba(70,76,110,.14)}
.btn-danger{background:#fdecec;color:#d23f3f;border:1px solid #f3c5c5}
.btn-solid-red{background:#e5484d;color:#fff;box-shadow:0 5px 14px rgba(229,72,77,.3)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.mrow{display:flex;gap:10px;margin-top:18px}
.mrow .btn{flex:1}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,#ffec9a,#ffc62e 55%,#dd8e10);
  box-shadow:inset 0 0 0 .09em rgba(255,255,255,.4),inset 0 -.08em .12em rgba(150,80,0,.45),0 .06em .18em rgba(160,110,20,.45);
  vertical-align:-.12em}
.chip{display:inline-flex;align-items:center;gap:5px;background:#fff;
  border:1px solid rgba(70,76,110,.14);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:700;color:#5e6489;
  box-shadow:0 2px 6px rgba(190,160,100,.12)}

.kidbar{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding:2px 2px 4px;-webkit-overflow-scrolling:touch}
.kidchip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;flex:none;
  background:#fff;border:1.5px solid rgba(70,76,110,.14);font-weight:800;font-size:13.5px;color:#565d84;
  cursor:pointer;user-select:none;white-space:nowrap;box-shadow:0 2px 6px rgba(190,160,100,.12);transition:.15s}
.kidchip .ka{font-size:17px}
.kidchip.on{border-color:var(--gold);background:#fff3d2;color:#9a6300}
.kidchip.add{border-style:dashed;color:var(--muted)}

/* ===== 顶部 HUD ===== */
.hud{position:relative;overflow:hidden;padding:18px 16px 16px;
  background:linear-gradient(150deg,#fff8e2 0%,#ffffff 48%,#eaf4ff 100%);
  border-color:rgba(245,170,40,.3)}
.hud::before{content:'';position:absolute;inset:-40% -20% auto;height:120%;
  background:radial-gradient(circle at 70% 0%,rgba(255,200,60,.3),transparent 55%);pointer-events:none}
.hud-top{display:flex;align-items:center;gap:12px}
.avatar{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:28px;
  background:linear-gradient(145deg,#fff4d2,#ffe3a6);
  box-shadow:0 0 0 2.5px rgba(245,165,20,.85),0 4px 14px rgba(245,170,40,.3)}
.hud-name{font-size:19px;font-weight:900;letter-spacing:.5px}
.hud-date{font-size:12.5px;color:var(--muted);margin-top:2px}
.hud-emblem{margin-left:auto;text-align:center}
.emblem-wrap{filter:drop-shadow(0 4px 9px rgba(160,120,40,.35))}
.emblem{width:56px;height:62px;clip-path:polygon(50% 0,100% 14%,100% 62%,50% 100%,0 62%,0 14%);
  display:grid;place-items:center;font-size:23px;font-weight:900;margin:0 auto}
.emblem.t0{background:linear-gradient(160deg,#d89c63,#84502a);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.emblem.t1{background:linear-gradient(160deg,#f0f4fb,#9bb0c9);color:#2c3a4f}
.emblem.t2{background:linear-gradient(160deg,#ffe06a,#efa617);color:#5a3b00}
.emblem.t3{background:linear-gradient(160deg,#b9f5e7,#35c9ab);color:#0b4a3f}
.emblem.t4{background:linear-gradient(160deg,#aac3ff,#6a5af0);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.emblem.t5{background:linear-gradient(160deg,#ffa564,#ff4d6d);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.tiername{font-size:12px;font-weight:800;margin-top:4px;color:#bb7a00;letter-spacing:1px}
.hud-balance{display:flex;align-items:baseline;gap:10px;margin:16px 0 4px}
.hud-balance .coin{width:30px;height:30px;align-self:center}
.balance-num{font-size:46px;font-weight:900;line-height:1;letter-spacing:.5px;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#ffb627,#e57a00);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 3px rgba(220,140,20,.25))}
.balance-num.pop{animation:pop .42s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1)}38%{transform:scale(1.22)}100%{transform:scale(1)}}
.balance-unit{font-size:13px;color:var(--muted);font-weight:600}
.xp{margin-top:12px}
.xp-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.xp-top b{color:#d98a00}
.xp-track{height:12px;border-radius:99px;background:rgba(70,76,110,.1);overflow:hidden;border:1px solid rgba(70,76,110,.06)}
.xp-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#ffd34d,#ff9b13);
  box-shadow:0 0 10px rgba(255,170,30,.5);transition:width .7s cubic-bezier(.22,1,.36,1)}
.hud-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* ===== 任务区 ===== */
.fullbanner{background:linear-gradient(135deg,#fff1c4,#ffe3b0);
  border:1px solid rgba(240,160,30,.45);border-radius:16px;padding:12px 14px;margin-bottom:14px;
  font-size:13.5px;font-weight:800;color:#9a6300;text-align:center}
.catsec{margin-bottom:16px}
.cathead{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800;margin:0 4px 8px}
.catdot{width:9px;height:9px;border-radius:50%;flex:none}
.catsum{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.cat-tasks{display:grid;gap:9px}
.task{display:flex;align-items:center;gap:12px;padding:13px 13px 13px 14px;border-radius:16px;
  background:var(--card);border:1px solid var(--line);border-left:4px solid var(--cat,#aaa);
  box-shadow:0 4px 12px rgba(190,160,100,.12);
  cursor:pointer;user-select:none;transition:transform .12s ease,background .2s,opacity .2s}
.task:active{transform:scale(.97)}
.task-main{flex:1;min-width:0}
.task-name{font-size:14.5px;font-weight:700;line-height:1.4}
.task-pts{display:inline-flex;align-items:center;gap:4px;margin-top:5px;font-size:12.5px;font-weight:800;color:#d98a00}
.task .tick{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:2px solid rgba(70,76,110,.2);font-size:17px;color:transparent;transition:.2s}
.task.done{opacity:.72;background:#eefaf2;border-color:#bfe8cf;border-left-color:var(--green)}
.task.done .tick{background:var(--green);border-color:var(--green);color:#fff}
.task.done .task-name{text-decoration:none}
.donechip{font-size:11px;color:#1f9e5d;font-weight:800;margin-left:6px}

/* ===== 商店 ===== */
.shop-balance{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800}
.shop-balance .num{font-size:24px;color:#e8950c;font-variant-numeric:tabular-nums}
.shopsec-title{font-size:14px;font-weight:800;margin:18px 2px 9px;display:flex;align-items:center;gap:7px}
.shopgrid{display:grid;gap:10px}
.shopitem{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:13px;box-shadow:0 4px 12px rgba(190,160,100,.12)}
.si-ico{width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:22px;
  background:#f7f4ea;border:1px solid rgba(70,76,110,.08)}
.si-main{flex:1;min-width:0}
.si-name{font-size:14.5px;font-weight:700}
.si-cost{display:flex;align-items:center;gap:5px;font-size:12.5px;color:#d98a00;font-weight:800;margin-top:4px}
.si-lack{font-size:11.5px;color:var(--muted);font-weight:600}
.goalbar{height:9px;border-radius:99px;background:rgba(70,76,110,.1);overflow:hidden;margin-top:7px}
.goalbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#5ce08c,#2fc46f);transition:width .6s}

/* ===== 报告 ===== */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;box-shadow:0 4px 12px rgba(190,160,100,.12)}
.tile .tv{font-size:26px;font-weight:900;color:#e8950c;font-variant-numeric:tabular-nums}
.tile .tl{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px}
.dotrow{display:flex;justify-content:space-between;gap:2px}
.dcell{flex:1;text-align:center;font-size:10px;color:var(--muted)}
.dot{width:17px;height:17px;border-radius:50%;margin:0 auto 5px;background:rgba(70,76,110,.1);border:1px solid rgba(70,76,110,.12)}
.dot.half{background:#ffdf8f;border-color:#f3bd4d}
.dot.full{background:linear-gradient(135deg,#ffd34d,#ff9b13);border-color:#f5a300;box-shadow:0 0 7px rgba(255,170,30,.5)}
.dleg{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--muted);justify-content:center}
.dleg span{display:inline-flex;align-items:center;gap:5px}
.dleg .dot{width:11px;height:11px;margin:0}
.bar-row{display:flex;align-items:center;gap:10px;margin:9px 0}
.bar-cat{width:78px;flex:none;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:5px}
.bar-track{flex:1;height:15px;border-radius:99px;background:rgba(70,76,110,.08);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .6s}
.bar-val{width:34px;flex:none;text-align:right;font-size:12.5px;font-weight:800;color:#c47b00;font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.badge{text-align:center;padding:13px 5px 11px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.badge.got{border-color:#f3c24d;background:linear-gradient(160deg,#fff6da,#ffffff);box-shadow:0 4px 14px rgba(240,180,40,.25)}
.badge.locked{opacity:.45;filter:grayscale(1)}
.badge .bi{font-size:27px;line-height:1}
.badge .bn{font-size:12px;font-weight:800;margin-top:7px}
.badge .bd{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}
.totrow{display:flex;justify-content:space-around;text-align:center}
.totrow .tv{font-size:20px;font-weight:900;color:#e8950c;font-variant-numeric:tabular-nums}
.totrow .tl{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ===== 账本 ===== */
.lfilters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.lfilters .chip{cursor:pointer}
.lfilters .chip.on{background:linear-gradient(135deg,#ffd34d,#ff9b13);color:#5a3600;border-color:transparent}
.ldate{font-size:12.5px;color:var(--muted);font-weight:800;margin:16px 2px 8px}
.lrow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:11px 13px;margin-bottom:8px;box-shadow:0 3px 10px rgba(190,160,100,.1)}
.lico{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:17px;
  background:#f7f4ea}
.lmain{flex:1;min-width:0}
.ldesc{font-size:13.5px;font-weight:700;line-height:1.35}
.ltime{font-size:11px;color:var(--muted);margin-top:2px}
.lamt{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;flex:none}
.lamt.plus{color:#1fa05e}.lamt.minus{color:#e05252}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty .ei{font-size:40px;margin-bottom:10px}

/* ===== 家长中心 ===== */
.plist{display:grid;gap:9px}
.prow{display:flex;align-items:center;gap:10px;background:#faf8f1;border:1px solid var(--line);
  border-radius:13px;padding:10px 12px}
.prow .pm{flex:1;min-width:0;font-size:13.5px;font-weight:700;line-height:1.4}
.prow .ps{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.prow.off{opacity:.5}
.sw{position:relative;width:44px;height:26px;border-radius:99px;background:rgba(70,76,110,.2);transition:.2s;flex:none;cursor:pointer}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--green)}
.sw.on::after{left:21px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.preset{padding:7px 14px;border-radius:99px;border:1px solid rgba(70,76,110,.16);background:#f7f5ee;
  font-size:13px;font-weight:800;color:#565d84;cursor:pointer;user-select:none}
.preset.on{background:#fdebeb;border-color:#e89090;color:#cf4444}
.avrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.avopt{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;cursor:pointer;
  background:#f7f5ee;border:2px solid rgba(70,76,110,.1);transition:.15s}
.avopt.on{border-color:var(--gold);background:#fff3d2;transform:scale(1.06)}
details summary::-webkit-details-marker{display:none}
.tips-body{margin-top:10px;font-size:13px;color:#5e6489;line-height:1.8}
.tips-body b{color:#bb7a00}

/* ===== 底部导航 / 侧边栏 ===== */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;justify-content:space-around;align-items:stretch;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(70,76,110,.1);box-shadow:0 -6px 20px rgba(190,160,100,.15);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.nbtn{flex:1;background:none;border:none;color:#9aa0bb;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border-radius:12px;transition:.15s}
.nbtn .ni{font-size:21px;line-height:1;transition:transform .15s}
.nbtn .nl{font-size:10.5px;font-weight:700}
.nbtn.on{color:#d98a00}
.nbtn.on .ni{transform:translateY(-2px) scale(1.12)}
.sidenav{display:none}

/* ===== 弹窗 / 提示 / 特效 ===== */
.mback{position:fixed;inset:0;background:rgba(75,60,25,.4);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  z-index:60;display:flex;align-items:center;justify-content:center;padding:22px;animation:fadeUp .2s ease}
.mcard{width:100%;max-width:420px;background:#ffffff;border:1px solid rgba(70,76,110,.1);border-radius:22px;
  padding:20px;box-shadow:0 22px 60px rgba(120,90,30,.3);max-height:84vh;overflow:auto}
.mtitle{font-size:17px;font-weight:900;text-align:center}
.msub{font-size:13px;color:var(--muted);text-align:center;margin-top:5px}
.mbody{font-size:14.5px;line-height:1.7;margin-top:14px;text-align:center}
.mbody b{color:#d98a00}
#toastRoot{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;z-index:80;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#33395e;border:1px solid rgba(255,255,255,.15);color:#fff;
  padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:700;max-width:100%;
  box-shadow:0 8px 24px rgba(60,50,20,.3);animation:toastIn .28s cubic-bezier(.22,1.4,.36,1)}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.92)}to{opacity:1;transform:none}}
.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:70;pointer-events:none;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(108vh) rotate(740deg)}}
.fco{position:fixed;z-index:75;font-weight:900;color:#e8950c;font-size:21px;pointer-events:none;
  text-shadow:0 1px 0 #fff,0 2px 8px rgba(200,140,20,.4);animation:fup 1s ease-out forwards}
@keyframes fup{to{transform:translateY(-72px);opacity:0}}
.cheer{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);z-index:72;pointer-events:none;
  background:#fff;border:2px solid #ffcf4d;border-radius:22px;padding:15px 26px;text-align:center;
  box-shadow:0 16px 44px rgba(225,155,30,.35);animation:cheerIn 1.9s cubic-bezier(.2,1.1,.3,1) forwards;max-width:86vw}
.cheer .ce{font-size:38px;line-height:1.1}
.cheer .ct{font-size:15.5px;font-weight:900;color:#b06a00;margin-top:7px}
@keyframes cheerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}
  12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
  22%{transform:translate(-50%,-50%) scale(1)}
  78%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-58%) scale(.95)}}
.pindots{display:flex;gap:13px;justify-content:center;margin:18px 0 20px}
.pindot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(70,76,110,.3)}
.pindot.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(245,165,20,.5)}

  .bottomnav{display:none}

  .brand .bi{font-size:24px;-webkit-text-fill-color:initial}
  .snbtn{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:14px;border:none;background:none;

  .snbtn .ni{font-size:19px}

  .snbtn.on{background:linear-gradient(135deg,#fff0c4,#ffe6ac);color:#9a6300;border:1px solid rgba(240,170,40,.4)}
  .sidefoot{margin-top:auto;padding:14px;border-radius:16px;background:#fff;border:1px solid var(--line);
    box-shadow:0 4px 14px rgba(190,160,100,.15);

}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .cheer{opacity:1}
}

<script>
'use strict';
/* ================= 基础工具 ================= */
const KEY='jfbank_v1';
const store=(()=>{
  let mem={},ls=false,db=null,lsErr='',dbErr='';
  try{const k='__t'+Math.random();localStorage.setItem(k,'1');localStorage.removeItem(k);ls=true}
  catch(e){lsErr=(e&&e.name?e.name:'Error')+' '+(e&&e.message?e.message:String(e))}
  function open(cb){
    try{
      if(!window.indexedDB){dbErr='indexedDB不存在';cb(null);return}
      const rq=indexedDB.open('jfbank_db',1);
      rq.onupgradeneeded=function(){try{rq.result.createObjectStore('kv')}catch(e){}};
      rq.onsuccess=function(){cb(rq.result)};
      rq.onerror=function(){dbErr=(rq.error&&rq.error.name?rq.error.name:'OpenError')+' '+(rq.error&&rq.error.message?rq.error.message:'');cb(null)};
      rq.onblocked=function(){dbErr='Blocked';cb(null)};
    }catch(e){dbErr=(e&&e.name?e.name:'Error')+' '+(e&&e.message?e.message:String(e));cb(null)}
  }
  return{
    ls:function(){return ls},
    hasDB:function(){return !!db},
    recheck:function(){
      if(!ls){try{const k='__t'+Math.random();localStorage.setItem(k,'1');localStorage.removeItem(k);ls=true;lsErr=''}catch(e){}}
      return ls;
    },
    retryDB:function(cb){
      if(db){if(cb)cb(true);return}
      open(function(d){db=d;if(cb)cb(!!d)});
    },
    diag:function(){return{ls:ls,lsErr:lsErr,db:!!db,dbErr:dbErr}},
    get(k){
      if(ls){try{const v=localStorage.getItem(k);if(v!=null)return v}catch(e){}}
      return (k in mem)?mem[k]:null;
    },
    set(k,v){
      mem[k]=v;
      if(ls){try{localStorage.setItem(k,v)}catch(e){}}
      if(db){try{db.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}
    },
    boot(done){
      open(function(d){
        db=d;
        if(!d){done(null);return}
        try{
          const rq=d.transaction('kv','readonly').objectStore('kv').get(KEY);
          rq.onsuccess=function(){done(rq.result!=null?String(rq.result):null)};
          rq.onerror=function(){done(null)};
        }catch(e){done(null)}
      });
    }
  };
})();
const el=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'i'+Date.now().toString(36)+Math.floor(Math.random()*1e8).toString(36);
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const today=()=>fmt(new Date());
function parseD(ds){const p=ds.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return fmt(d)}
function nextDay(ds){const d=parseD(ds);d.setDate(d.getDate()+1);return fmt(d)}
const dateCN=ds=>{const d=parseD(ds);return (d.getMonth()+1)+'月'+d.getDate()+'日'};
const weekCN=ds=>['周日','周一','周二','周三','周四','周五','周六'][parseD(ds).getDay()];
const timeHM=ts=>{const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

/* ================= 常量配置 ================= */
const CATS={
  study:{name:'学习',icon:'📘',color:'#4cc9ff'},
  manner:{name:'礼貌',icon:'💬',color:'#ff7eb6'},
  friend:{name:'同学相处',icon:'🤝',color:'#5ce08c'},
  chore:{name:'家务',icon:'🧹',color:'#ffb04d'}
};
const CATORDER=['study','manner','friend','chore'];
const LEVELS=[
  {name:'青铜',need:0,cls:'t0',glyph:'Ⅰ'},
  {name:'白银',need:40,cls:'t1',glyph:'Ⅱ'},
  {name:'黄金',need:100,cls:'t2',glyph:'Ⅲ'},
  {name:'铂金',need:200,cls:'t3',glyph:'Ⅳ'},
  {name:'钻石',need:350,cls:'t4',glyph:'Ⅴ'},
  {name:'王者',need:550,cls:'t5',glyph:'Ⅵ'}
];
const TYPEMETA={
  earn:{i:'✅'},bonus:{i:'🔥'},redeem:{i:'🎁'},
  deduct:{i:'⚠️'},recover:{i:'💖'},adjust:{i:'✏️'}
};
const RTYPE={cash:{name:'现金兑换',icon:'💵'},priv:{name:'特权奖励',icon:'🎟️'},goal:{name:'储蓄目标',icon:'🎯'}};
const AVATARS=['🦸','🦹','🐯','🦊','🚀','⚡','🐲','🏀','🦖','🎮'];

/* ================= 数据 ================= */
function defaultKid(name,avatar){
  const t=(name,cat,pts)=>({id:uid(),name,cat,pts,on:true});
  const r=(name,type,cost)=>({id:uid(),name,type,cost});
  return{
    id:uid(),
    name:name||'小勇士',avatar:avatar||'🦸',
    tasks:[
      t('到家30分钟内开始写作业','study',2),
      t('认真完成作业并订正好','study',2),
      t('课外阅读20分钟','study',1),
      t('全天好好说话、不顶嘴','manner',2),
      t('主动问好，会说"谢谢、对不起"','manner',1),
      t('全天没有主动招惹同学','friend',3),
      t('帮助了同学（说得出具体事）','friend',2),
      t('帮忙打扫卫生','chore',3),
      t('整理自己的书包和房间','chore',1)
    ],
    rewards:[
      r('兑换 5 元零花钱','cash',5),
      r('兑换 10 元零花钱','cash',10),
      r('多玩 30 分钟（游戏/动画）','priv',8),
      r('周末晚睡 30 分钟','priv',6),
      r('点一顿想吃的大餐','priv',12),
      r('周末活动我做主','priv',15),
      r('储蓄目标：心仪的玩具','goal',80)
    ],
    records:[],ledger:[],deductions:[],fullDays:[],badges:{}
  };
}
function defaultState(){
  const k=defaultKid();
  return{v:2,setup:false,settings:{pin:'',sound:true,voice:true},kids:[k],cur:k.id};
}
function normalize(d){
  try{
    if(!d)return null;
    if(d.v===1){
      if(!Array.isArray(d.tasks)||!Array.isArray(d.ledger))return null;
      const k={id:uid(),
        name:(d.child&&d.child.name)||'小勇士',avatar:(d.child&&d.child.avatar)||'🦸',
        tasks:d.tasks,rewards:d.rewards||[],records:d.records||[],ledger:d.ledger,
        deductions:d.deductions||[],fullDays:d.fullDays||[],badges:d.badges||{}};
      d={v:2,setup:!!d.setup,settings:d.settings||{pin:'',sound:true,voice:true},kids:[k],cur:k.id};
    }else if(d.v===2){
      if(!Array.isArray(d.kids)||!d.kids.length)return null;
    }else return null;
    if(!d.settings)d.settings={pin:'',sound:true,voice:true};
    if(d.settings.voice===undefined)d.settings.voice=true;
    d.kids.forEach(k=>{
      k.tasks=k.tasks||[];k.rewards=k.rewards||[];k.records=k.records||[];
      k.ledger=k.ledger||[];k.deductions=k.deductions||[];k.fullDays=k.fullDays||[];k.badges=k.badges||{};
    });
    if(!d.kids.some(k=>k.id===d.cur))d.cur=d.kids[0].id;
    return d;
  }catch(e){return null}
}
function load(){
  try{
    const raw=store.get(KEY);if(!raw)return null;
    return normalize(JSON.parse(raw));
  }catch(e){return null}
}
function save(){store.set(KEY,JSON.stringify(S))}
let _ls0=load();
let S=_ls0||defaultState();
function kid(){
  let k=S.kids.find(x=>x.id===S.cur);
  if(!k){k=S.kids[0];S.cur=k.id}
  return k;
}
function balanceOf(k){return k.ledger.reduce((a,e)=>a+e.amt,0)}
let unlocked=false, ledgerFilter='all', view='home', _day=today(), _cb=null;
let setupAv=S.kids[0].avatar||'🦸', dedPts=5;

/* ================= 派生计算 ================= */
const balance=()=>kid().ledger.reduce((a,e)=>a+e.amt,0);
const cumEarned=()=>kid().ledger.reduce((a,e)=>a+(e.amt>0?e.amt:0),0);
const cumRedeemed=()=>kid().ledger.filter(e=>e.type==='redeem').reduce((a,e)=>a-e.amt,0);
const activeTasks=()=>kid().tasks.filter(t=>t.on);
const doneOn=(taskId,ds)=>kid().records.some(r=>r.taskId===taskId&&r.date===ds);
const doneToday=taskId=>doneOn(taskId,today());
function levelInfo(){
  const p=cumEarned();let i=0;
  LEVELS.forEach((L,k)=>{if(p>=L.need)i=k});
  return{i,cur:LEVELS[i],next:LEVELS[i+1]||null,p};
}
function streakOf(hasFn){
  let n=0,d=new Date();
  if(!hasFn(fmt(d)))d.setDate(d.getDate()-1);
  while(hasFn(fmt(d))){n++;d.setDate(d.getDate()-1);if(n>3650)break}
  return n;
}
const checkinStreak=()=>streakOf(ds=>kid().records.some(r=>r.date===ds));
const fullStreak=()=>streakOf(ds=>kid().fullDays.includes(ds));
const catStreak=c=>streakOf(ds=>kid().records.some(r=>r.date===ds&&r.cat===c));
function bestStreak(){
  const ds=[...new Set(kid().records.map(r=>r.date))].sort();
  let best=0,run=0,prev=null;
  for(const d of ds){run=(prev&&nextDay(prev)===d)?run+1:1;if(run>best)best=run;prev=d}
  return best;
}

/* ================= 勋章 ================= */
const BADGES=[
  {id:'first',icon:'🌱',name:'新手上路',desc:'完成第一次打卡',test:()=>kid().records.length>0},
  {id:'firstfull',icon:'🚀',name:'旗开得胜',desc:'第一次做到当日全勤',test:()=>kid().fullDays.length>0},
  {id:'streak7',icon:'🔥',name:'坚持之星',desc:'连续打卡 7 天',test:()=>checkinStreak()>=7},
  {id:'streak14',icon:'⚡',name:'雷打不动',desc:'连续打卡 14 天',test:()=>checkinStreak()>=14},
  {id:'full7',icon:'🏅',name:'全勤一周',desc:'连续 7 天完成全部任务',test:()=>fullStreak()>=7},
  {id:'friend7',icon:'🤝',name:'友谊大使',desc:'连续 7 天和同学友好相处',test:()=>catStreak('friend')>=7},
  {id:'rich100',icon:'💰',name:'百分富翁',desc:'累计赚到 100 金币',test:()=>cumEarned()>=100},
  {id:'study30',icon:'📚',name:'学习小达人',desc:'学习类任务完成 30 次',test:()=>kid().records.filter(r=>r.cat==='study').length>=30},
  {id:'chore20',icon:'🧹',name:'劳动小能手',desc:'家务类任务完成 20 次',test:()=>kid().records.filter(r=>r.cat==='chore').length>=20},
  {id:'wish1',icon:'🎁',name:'心愿达成',desc:'完成第一次兑换',test:()=>kid().ledger.some(e=>e.type==='redeem')},
  {id:'fix1',icon:'💖',name:'知错能改',desc:'第一次完成补救，赢回信任',test:()=>kid().deductions.some(d=>d.recovered)},
  {id:'king',icon:'👑',name:'王者驾到',desc:'达到王者段位',test:()=>cumEarned()>=550}
];
function badgeSweep(){
  BADGES.forEach(b=>{
    if(!kid().badges[b.id]&&b.test()){
      kid().badges[b.id]=today();
      toast('🏅 获得新勋章「'+b.name+'」！',3200);
      confetti(55);sfxFanfare();
    }
  });
}

/* ================= 特效与音效 ================= */
const reduceMotion=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function toast(msg,ms){
  const root=el('toastRoot');
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  root.appendChild(t);
  while(root.children.length>3)root.removeChild(root.firstChild);
  setTimeout(()=>{if(t.parentNode)t.parentNode.removeChild(t)},ms||2600);
}
function confetti(n){
  if(reduceMotion())return;
  const colors=['#ffd23f','#ff9f1a','#5ce08c','#4cc9ff','#ff7eb6','#c9a7ff'];
  const root=el('fxRoot');
  for(let i=0;i<n;i++){
    const c=document.createElement('div');c.className='cf';
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration=(1.6+Math.random()*1.6)+'s';
    c.style.animationDelay=(Math.random()*.4)+'s';
    c.style.borderRadius=Math.random()>.5?'50%':'2px';
    c.style.opacity=String(.65+Math.random()*.35);
    root.appendChild(c);
    setTimeout(()=>{if(c.parentNode)c.parentNode.removeChild(c)},3800);
  }
}
function floatCoin(ev,txt){
  if(reduceMotion())return;
  const f=document.createElement('div');f.className='fco';f.textContent=txt+' 🪙';
  const x=(ev&&ev.clientX)||window.innerWidth/2;
  const y=(ev&&ev.clientY)||window.innerHeight/2;
  f.style.left=(x-20)+'px';f.style.top=(y-28)+'px';
  el('fxRoot').appendChild(f);
  setTimeout(()=>{if(f.parentNode)f.parentNode.removeChild(f)},1100);
}
let actx=null;
function sfx(seq){
  if(!S.settings.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    seq.forEach(p=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='triangle';o.frequency.value=p[0];
      o.connect(g);g.connect(actx.destination);
      const t0=actx.currentTime+p[1];
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.18,t0+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+p[2]);
      o.start(t0);o.stop(t0+p[2]+0.05);
    });
  }catch(e){}
}

function speak(txt){
  if(!S.settings.voice)return;
  try{
    if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined')return;
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='zh-CN';u.rate=1;u.pitch=1.12;u.volume=1;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function cheer(emoji,txt){
  const root=el('fxRoot');
  const old=root.querySelector('.cheer');if(old)old.remove();
  const c=document.createElement('div');c.className='cheer';
  c.innerHTML='<div class="ce">'+emoji+'</div><div class="ct">'+esc(txt)+'</div>';
  root.appendChild(c);
  setTimeout(function(){if(c.parentNode)c.parentNode.removeChild(c)},1950);
}
function cheerTask(pts){

/* ================= 核心动作 ================= */
function tapTask(id,ev){
  const t=kid().tasks.find(x=>x.id===id);if(!t)return;
  if(doneToday(id)){toast('今天已经完成啦 ✓（误点可在家长中心撤销）');return}
  const prevLv=levelInfo().i;
  const lid=uid();
  kid().ledger.push({id:lid,ts:Date.now(),date:today(),type:'earn',amt:t.pts,desc:t.name});
  kid().records.push({id:uid(),date:today(),taskId:id,name:t.name,cat:t.cat,pts:t.pts,ledgerId:lid,ts:Date.now()});
  floatCoin(ev,'+'+t.pts);sfxCoin();
  cheerTask(t.pts);
  const acts=activeTasks();
  if(acts.length&&acts.every(x=>doneToday(x.id))&&!kid().fullDays.includes(today())){
    kid().fullDays.push(today());
    toast('🎉 今日全勤！所有任务都完成了',3000);
    confetti(70);
    cheer('🎉','今日全勤达成！');
    speak(kid().name+'，今日全勤达成，你真棒！');
    const fs=fullStreak();
    if(fs>0&&fs%7===0&&!kid().ledger.some(e=>e.type==='bonus'&&e.date===today())){
      kid().ledger.push({id:uid(),ts:Date.now(),date:today(),type:'bonus',amt:5,desc:'连续 '+fs+' 天全勤奖励'});
      toast('🔥 连续 '+fs+' 天全勤，额外奖励 +5！',3400);
    }
  }
  if(levelInfo().i>prevLv){
    confetti(130);sfxFanfare();
    toast('🆙 升级啦！现在是 '+levelInfo().cur.name+' 段位！',3800);
    cheer('🆙','升级到 '+levelInfo().cur.name+' 段位！');
    speak('哇，升级啦！'+kid().name+'现在是'+levelInfo().cur.name+'段位！');
  }
  badgeSweep();save();renderAll();
  const bn=document.querySelector('.balance-num');
  if(bn){bn.classList.remove('pop');void bn.offsetWidth;bn.classList.add('pop')}
}
function askRedeem(id){
  const r=kid().rewards.find(x=>x.id===id);if(!r)return;
  const bal=balance();
  if(bal<r.cost){toast('还差 '+(r.cost-bal)+' 金币，继续加油！💪');return}
  showConfirm('确定用 <b>'+r.cost+'</b> 金币兑换<br>「'+esc(r.name)+'」吗？',function(){
    kid().ledger.push({id:uid(),ts:Date.now(),date:today(),type:'redeem',amt:-r.cost,desc:'兑换：'+r.name});
    sfxBuy();confetti(40);
    cheer('🎁','愿望达成！');
    speak('恭喜'+kid().name+'，兑换成功！');
    toast('🎁 兑换成功！记得找爸爸妈妈兑现哦',3200);
    badgeSweep();save();renderAll();
  },'兑换');
}
function doDeduct(){
  let reason=el('dedReason').value;
  if(reason==='__c')reason=el('dedCustom').value.trim();
  if(!reason){toast('请填写或选择行为原因');return}
  const nominal=dedPts;
  if(!nominal||nominal<1){toast('请选择扣分分值');return}
  const actual=Math.min(balance(),nominal);
  if(actual>0){
    kid().ledger.push({id:uid(),ts:Date.now(),date:today(),type:'deduct',amt:-actual,
      desc:'严重行为：'+reason+(actual<nominal?'（余额不足，实扣'+actual+'）':'')});
  }
  kid().deductions.push({id:uid(),ts:Date.now(),date:today(),reason,nominal,actual,recovered:false});
  toast('已记录扣分。引导孩子完成"道歉 + 弥补"，可返还一半');
  save();renderAll();
}
function doRecover(id){
  const d=kid().deductions.find(x=>x.id===id);if(!d||d.recovered)return;
  const back=Math.ceil(d.actual/2);
  d.recovered=true;
  if(back>0){
    kid().ledger.push({id:uid(),ts:Date.now(),date:today(),type:'recover',amt:back,desc:'补救返还：'+d.reason});
    toast('💖 补救完成，返还 '+back+' 金币');
  }else{
    toast('💖 已记录补救完成');
  }
  cheer('💖','知错能改，了不起！');
  speak(kid().name+'，知错能改，真勇敢！');
  badgeSweep();save();renderAll();
}
function doAdjust(){
  let a=parseInt(el('adjAmt').value,10);
  const reason=el('adjReason').value.trim();
  if(!a||!reason){toast('请填写分值（可为负数）和原因');return}
  if(a<0){
    const c=Math.min(balance(),-a);
    if(c<=0){toast('当前余额为 0，不能再扣了');return}
    if(c<-a)toast('余额不足，按 -'+c+' 记录');
    a=-c;
  }
  kid().ledger.push({id:uid(),ts:Date.now(),date:today(),type:'adjust',amt:a,desc:reason});
  toast('已调整 '+(a>0?'+':'')+a+' 金币');
  el('adjAmt').value='';el('adjReason').value='';
  badgeSweep();save();renderAll();
}
function undoRecord(rid){
  const r=kid().records.find(x=>x.id===rid);if(!r)return;
  kid().records=kid().records.filter(x=>x.id!==rid);
  kid().ledger=kid().ledger.filter(e=>e.id!==r.ledgerId);
  if(kid().fullDays.includes(r.date)&&!activeTasks().every(x=>doneOn(x.id,r.date))){
    kid().fullDays=kid().fullDays.filter(d=>d!==r.date);
    const b=kid().ledger.find(e=>e.type==='bonus'&&e.date===r.date);
    if(b)kid().ledger=kid().ledger.filter(e=>e.id!==b.id);
  }
  save();renderAll();toast('已撤销：'+r.name);
}

  let h=kidBar(true);
  h+='<div class="card"><div class="h2">👨‍👩‍👧‍👦 孩子管理<span class="sub">当前：'+esc(kid().avatar)+' '+esc(kid().name)+'</span></div><div class="plist">'+
    S.kids.map(k=>'<div class="prow"><div class="pm">'+esc(k.avatar)+' '+esc(k.name)+
      '<div class="ps">余额 '+balanceOf(k)+' 金币 · 任务 '+k.tasks.filter(t=>t.on).length+' 个</div></div>'+
      (k.id===S.cur?'<span class="chip">使用中</span>':'<button class="btn btn-ghost btn-sm" onclick="setKid(\''+k.id+'\')">切换</button>')+
      '<button class="btn btn-ghost btn-sm" onclick="openKidEditor(\''+k.id+'\')">编辑</button>'+
      (S.kids.length>1?'<button class="btn btn-danger btn-sm" onclick="delKid(\''+k.id+'\')">删</button>':'')+
      '</div>').join('')+
    '</div><div class="mrow"><button class="btn btn-gold" onclick="openKidEditor()">＋ 添加孩子</button></div>'+
    '<div class="hint" style="margin-top:10px">每个孩子的任务、金币、勋章、段位完全独立；家长密码全家共用。下面所有管理操作（打卡撤销、扣分、任务、奖励）都只作用于"当前"孩子，切换后再操作另一个。</div></div>';
  const tr=kid().records.filter(r=>r.date===today()).sort((a,b)=>b.ts-a.ts);
  h+='<div class="card"><div class="h2">✅ 今日打卡管理<span class="sub">误点可撤销</span></div>';
  if(!tr.length)h+='<div class="hint">今天还没有打卡记录</div>';
  else h+='<div class="plist">'+tr.map(r=>'<div class="prow"><div class="pm">'+CATS[r.cat].icon+' '+esc(r.name)+
    '<div class="ps">'+timeHM(r.ts)+' · +'+r.pts+' 金币</div></div>'+
    '<button class="btn btn-ghost btn-sm" onclick="undoRecord(\''+r.id+'\')">撤销</button></div>').join('')+'</div>';
  h+='</div>';

  h+='<div class="card"><div class="h2">⚠️ 严重行为记录</div>'+
    '<div class="hint">只对动手打人、骂人、撒谎等严重行为扣分；日常小毛病用口头提醒，不动金币。</div>'+
    '<label class="flab">行为</label><select id="dedReason" onchange="onDedReason()">'+
    ['动手打人','说脏话骂人','撒谎','故意损坏物品'].map(x=>'<option value="'+x+'">'+x+'</option>').join('')+
    '<option value="__c">自定义…</option></select>'+
    '<input id="dedCustom" style="display:none;margin-top:8px" maxlength="20" placeholder="写下具体行为">'+
    '<label class="flab">扣分分值</label><div class="presets">'+
    [3,5,10].map(v=>'<span class="preset'+(dedPts===v?' on':'')+'" onclick="setDed('+v+',this)">-'+v+'</span>').join('')+'</div>'+
    '<input id="dedPtsCustom" type="number" min="1" max="99" style="margin-top:8px" placeholder="或输入自定义分值" oninput="customDed(this)">'+
    '<div class="mrow"><button class="btn btn-solid-red" onclick="doDeduct()">记一笔扣分</button></div>'+
    '<div class="hint" style="margin-top:10px">💖 补救机制：孩子完成「道歉 + 弥补」后，点下方按钮返还一半金币——让孩子知道错误可以修复，而不是破罐子破摔。</div>';
  const ds=kid().deductions.slice().sort((a,b)=>b.ts-a.ts).slice(0,8);
  if(ds.length){
    h+='<div class="plist" style="margin-top:10px">'+ds.map(d=>'<div class="prow"><div class="pm">'+esc(d.reason)+
      '<div class="ps">'+dateCN(d.date)+' · 扣 '+d.actual+(d.actual<d.nominal?'（应扣 '+d.nominal+'）':'')+'</div></div>'+
      (d.recovered?'<span class="chip">💖 已补救</span>'
        :'<button class="btn btn-ghost btn-sm" onclick="doRecover(\''+d.id+'\')">✅ 补救返还 '+Math.ceil(d.actual/2)+'</button>')+
      '</div>').join('')+'</div>';
  }
  h+='</div>';

  h+='<div class="card"><div class="h2">✏️ 手动调整</div>'+
    '<label class="flab">分值（正数加分，负数扣分）</label><input id="adjAmt" type="number" placeholder="例如 5 或 -5">'+
    '<label class="flab">原因</label><input id="adjReason" maxlength="30" placeholder="例如：眼镜赔偿分期 第1周">'+
    '<div class="mrow"><button class="btn btn-ghost" onclick="doAdjust()">记录调整</button></div>'+
    '<div class="hint" style="margin-top:10px">💡 大额责任建议分期承担：比如眼镜赔偿，每周 -5、连续若干周，让孩子持续参与承担，而不是一次扣光失去动力。</div></div>';

  h+='<div class="card"><div class="h2">📋 任务管理<span class="sub">关闭=暂停，历史保留</span></div><div class="plist">'+
    kid().tasks.map(t=>'<div class="prow'+(t.on?'':' off')+'"><div class="pm">'+CATS[t.cat].icon+' '+esc(t.name)+
      '<div class="ps">'+CATS[t.cat].name+' · +'+t.pts+' 金币</div></div>'+
      '<div class="sw'+(t.on?' on':'')+'" onclick="toggleTask(\''+t.id+'\')"></div>'+
      '<button class="btn btn-ghost btn-sm" onclick="openTaskEditor(\''+t.id+'\')">编辑</button>'+
      '<button class="btn btn-danger btn-sm" onclick="delTask(\''+t.id+'\')">删</button></div>').join('')+
    '</div><div class="mrow"><button class="btn btn-gold" onclick="openTaskEditor()">＋ 添加任务</button></div></div>';

  h+='<div class="card"><div class="h2">🎁 奖励管理</div><div class="plist">'+
    kid().rewards.map(r=>'<div class="prow"><div class="pm">'+RTYPE[r.type].icon+' '+esc(r.name)+
      '<div class="ps">'+RTYPE[r.type].name+' · '+r.cost+' 金币</div></div>'+
      '<button class="btn btn-ghost btn-sm" onclick="openRewardEditor(\''+r.id+'\')">编辑</button>'+
      '<button class="btn btn-danger btn-sm" onclick="delReward(\''+r.id+'\')">删</button></div>').join('')+
    '</div><div class="mrow"><button class="btn btn-gold" onclick="openRewardEditor()">＋ 添加奖励</button></div></div>';

  h+='<div class="card"><div class="h2">⚙️ 数据与设置</div>'+
    '<label class="flab">当前孩子昵称</label><div class="mrow" style="margin-top:0"><input id="pfName" maxlength="10" value="'+esc(kid().name)+'"><button class="btn btn-ghost" style="flex:none" onclick="saveName()">保存</button></div>'+
    '<label class="flab">当前孩子头像</label><div class="avrow" id="pAvRow">'+AVATARS.map(a=>'<div class="avopt'+(kid().avatar===a?' on':'')+'" onclick="setAvatar(\''+a+'\',this)">'+a+'</div>').join('')+'</div>'+
    '<div class="prow" style="margin-top:14px"><div class="pm">🔔 打卡音效</div><div class="sw'+(S.settings.sound?' on':'')+'" onclick="toggleSound(this)"></div></div>'+
    '<div class="prow" style="margin-top:8px"><div class="pm">🗣️ 语音鼓励<div class="ps">打卡和兑换时说一句鼓励的话</div></div><div class="sw'+(S.settings.voice?' on':'')+'" onclick="toggleVoice(this)"></div></div>'+
    '<label class="flab">修改家长密码（4 位数字）</label><div class="mrow" style="margin-top:0"><input id="npin" inputmode="numeric" maxlength="4" placeholder="新密码"><button class="btn btn-ghost" style="flex:none" onclick="changePin()">修改</button></div>'+
    '<div class="mrow"><button class="btn btn-ghost" onclick="exportData()">📤 导出备份</button>'+
    '<label class="btn btn-ghost" style="text-align:center">📥 导入备份<input id="impFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></label></div>'+
    '<div class="mrow"><button class="btn btn-danger" onclick="clearAll()">🗑️ 清空全部数据</button></div></div>';

  h+='<div class="card"><details><summary style="cursor:pointer;font-weight:800">💡 使用小贴士（建议先看）</summary><div class="tips-body">'+
    '· <b>规则共同定</b>：和孩子一起确认任务和分值，他点头认可才算数。<br>'+
    '· <b>当天兑现</b>：打卡当场加分、兑换尽快兑现，信任感是这套系统的命根子。<br>'+
    '· <b>扣分要克制</b>：只扣严重行为，扣完引导道歉+弥补，可赢回一半。<br>'+
    '· <b>赔偿用分期</b>：像眼镜赔偿这类大额责任，用「手动调整」每周 -5 分期承担。<br>'+
    '· <b>逐步换挡</b>：坚持一两个月后，把现金奖励慢慢换成特权和真诚的表扬。<br>'+
    '· <b>每晚一起对照打卡</b>：把它变成睡前 5 分钟的亲子小仪式。</div></details></div>';

  h+='<div class="mrow"><button class="btn btn-ghost" onclick="lockParent()">🔒 退出家长模式</button></div>';
  root.innerHTML=h;
}
function onDedReason(){el('dedCustom').style.display=el('dedReason').value==='__c'?'block':'none'}
function setDed(v,btn){
  dedPts=v;
  document.querySelectorAll('.preset').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const c=el('dedPtsCustom');if(c)c.value='';
}
function customDed(inp){
  const v=parseInt(inp.value,10);
  if(v>0){dedPts=v;document.querySelectorAll('.preset').forEach(b=>b.classList.remove('on'))}
}
function toggleTask(id){const t=kid().tasks.find(x=>x.id===id);if(!t)return;t.on=!t.on;save();renderView()}
function delTask(id){
  const t=kid().tasks.find(x=>x.id===id);if(!t)return;
  showConfirm('确定删除任务「'+esc(t.name)+'」？<br><span class="hint">已有的打卡记录会保留</span>',function(){
    kid().tasks=kid().tasks.filter(x=>x.id!==id);save();renderView();toast('已删除');
  },'删除',true);
}
let editTaskId=null,editRewardId=null;
function openTaskEditor(id){
  editTaskId=id||null;
  const t=id?kid().tasks.find(x=>x.id===id):null;
  modal('<div class="mtitle">'+(t?'编辑任务':'添加任务')+'</div>'+
    '<label class="flab">任务名称</label><input id="teName" maxlength="20" value="'+(t?esc(t.name):'')+'">'+
    '<label class="flab">类别</label><select id="teCat">'+CATORDER.map(c=>'<option value="'+c+'"'+(t&&t.cat===c?' selected':'')+'>'+CATS[c].icon+' '+CATS[c].name+'</option>').join('')+'</select>'+
    '<label class="flab">金币（建议 1–3，重点任务 3）</label><input id="tePts" type="number" min="1" max="20" value="'+(t?t.pts:2)+'">'+
    '<div class="mrow"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-gold" onclick="saveTask()">保存</button></div>');
}
function saveTask(){
  const name=el('teName').value.trim(),cat=el('teCat').value,pts=parseInt(el('tePts').value,10);
  if(!name){toast('请填写任务名称');return}
  if(!pts||pts<1||pts>20){toast('金币请填 1–20');return}
  if(editTaskId){const t=kid().tasks.find(x=>x.id===editTaskId);if(t){t.name=name;t.cat=cat;t.pts=pts}}
  else kid().tasks.push({id:uid(),name:name,cat:cat,pts:pts,on:true});
  closeModal();save();renderView();toast('已保存');
}
function delReward(id){
  const r=kid().rewards.find(x=>x.id===id);if(!r)return;
  showConfirm('确定删除奖励「'+esc(r.name)+'」？',function(){
    kid().rewards=kid().rewards.filter(x=>x.id!==id);save();renderView();toast('已删除');
  },'删除',true);
}
function openRewardEditor(id){
  editRewardId=id||null;
  const r=id?kid().rewards.find(x=>x.id===id):null;
  modal('<div class="mtitle">'+(r?'编辑奖励':'添加奖励')+'</div>'+
    '<label class="flab">奖励名称</label><input id="reName" maxlength="20" value="'+(r?esc(r.name):'')+'">'+
    '<label class="flab">类型</label><select id="reType">'+['cash','priv','goal'].map(k=>'<option value="'+k+'"'+(r&&r.type===k?' selected':'')+'>'+RTYPE[k].icon+' '+RTYPE[k].name+'</option>').join('')+'</select>'+
    '<label class="flab">所需金币</label><input id="reCost" type="number" min="1" max="999" value="'+(r?r.cost:10)+'">'+
    '<div class="mrow"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-gold" onclick="saveReward()">保存</button></div>');
}
function saveReward(){
  const name=el('reName').value.trim(),type=el('reType').value,cost=parseInt(el('reCost').value,10);
  if(!name){toast('请填写奖励名称');return}
  if(!cost||cost<1||cost>999){toast('金币请填 1–999');return}
  if(editRewardId){const r=kid().rewards.find(x=>x.id===editRewardId);if(r){r.name=name;r.type=type;r.cost=cost}}
  else kid().rewards.push({id:uid(),name:name,type:type,cost:cost});
  closeModal();save();renderView();toast('已保存');
}
function saveName(){
  const n=el('pfName').value.trim();
  if(!n){toast('昵称不能为空');return}
  kid().name=n;save();toast('已保存昵称');
}
function setAvatar(a,btn){
  kid().avatar=a;save();
  document.querySelectorAll('#pAvRow .avopt').forEach(x=>x.classList.toggle('on',x===btn));
  toast('头像已更新 '+a);
}
function toggleSound(sw){
  S.settings.sound=!S.settings.sound;
  sw.classList.toggle('on',S.settings.sound);
  save();if(S.settings.sound)sfxCoin();
}
function toggleVoice(sw){
  S.settings.voice=!S.settings.voice;
  sw.classList.toggle('on',S.settings.voice);
  save();
  if(S.settings.voice)speak('语音鼓励已打开');
  else if('speechSynthesis' in window)try{window.speechSynthesis.cancel()}catch(e){}
}
function changePin(){
  const p=el('npin').value.trim();
  if(!/^\d{4}$/.test(p)){toast('密码需为 4 位数字');return}
  S.settings.pin=p;el('npin').value='';save();toast('密码已修改');
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='积分银行备份_'+today()+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},400);
  toast('备份已导出');
}
function importData(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=function(){
    try{
      const d=normalize(JSON.parse(rd.result));
      if(!d)throw 0;
      showConfirm('导入将<b>覆盖</b>当前全部数据，确定吗？',function(){
        S=d;save();renderAll();toast('导入成功 ✓');
      },'覆盖导入',true);
    }catch(e){toast('文件格式不对，导入失败')}
  };
  rd.readAsText(f);inp.value='';
}
function clearAll(){
  showConfirm('将<b>清空所有数据</b>并重新开始，确定吗？<br><span class="hint">建议先导出备份</span>',function(){
    S=defaultState();save();unlocked=false;setupAv=kid().avatar;
    el('setup').style.display='flex';renderSetup();setView('home');
    toast('已重置，请重新设置');
  },'清空重置',true);
}
function lockParent(){unlocked=false;gotoView('home');toast('已退出家长模式')}

/* ================= 弹窗 ================= */
function modal(html){
  el('modalRoot').innerHTML='<div class="mback" onclick="if(event.target===this)closeModal()"><div class="mcard">'+html+'</div></div>';
}
function closeModal(){el('modalRoot').innerHTML='';_cb=null;pinBuf=''}
function showConfirm(html,cb,okText,danger){
  _cb=cb;
  modal('<div class="mbody">'+html+'</div><div class="mrow">'+
    '<button class="btn btn-ghost" onclick="closeModal()">取消</button>'+
    '<button class="btn '+(danger?'btn-solid-red':'btn-gold')+'" onclick="confirmOk()">'+(okText||'确定')+'</button></div>');
}
function confirmOk(){const f=_cb;closeModal();if(f)f()}

/* ================= 家长密码 ================= */
let pinBuf='';
function dotsHtml(){let s='';for(let i=0;i<4;i++)s+='<div class="pindot'+(i<pinBuf.length?' on':'')+'"></div>';return s}
function openPin(){
  pinBuf='';
  const keys=[1,2,3,4,5,6,7,8,9,'B',0,'C'];
  modal('<div class="mtitle">🔐 家长中心</div><div class="msub">请输入 4 位家长密码</div>'+
    '<div class="pindots" id="pind">'+dotsHtml()+'</div>'+
    '<div class="pinpad">'+keys.map(function(k){
      if(k==='B')return '<button class="pinkey" onclick="pinDel()">⌫</button>';
      if(k==='C')return '<button class="pinkey" style="font-size:14px" onclick="closeModal()">取消</button>';
      return '<button class="pinkey" onclick="pinPress('+k+')">'+k+'</button>';
    }).join('')+'</div>');
}
function pinPress(n){
  if(pinBuf.length>=4)return;
  pinBuf+=String(n);
  el('pind').innerHTML=dotsHtml();
  if(pinBuf.length===4){
    if(pinBuf===S.settings.pin){
      unlocked=true;closeModal();setView('parent');toast('欢迎进入家长中心');
    }else{
      const card=document.querySelector('.mcard');
      if(card){card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake')}
      toast('密码不对，再试一次');
      setTimeout(function(){pinBuf='';const d=el('pind');if(d)d.innerHTML=dotsHtml()},380);
    }
  }
}
function pinDel(){pinBuf=pinBuf.slice(0,-1);el('pind').innerHTML=dotsHtml()}

/* ================= 首次设置 ================= */
function renderSetup(){
  el('suAvRow').innerHTML=AVATARS.map(a=>'<div class="avopt'+(setupAv===a?' on':'')+'" onclick="setupPick(\''+a+'\',this)">'+a+'</div>').join('');
}
function setupPick(a,btn){
  setupAv=a;
  document.querySelectorAll('#suAvRow .avopt').forEach(x=>x.classList.toggle('on',x===btn));
}
function finishSetup(){
  const name=el('suName').value.trim()||'小勇士';
  const pin=el('suPin').value.trim();
  if(!/^\d{4}$/.test(pin)){toast('家长密码需为 4 位数字');return}
  kid().name=name;kid().avatar=setupAv;S.settings.pin=pin;S.setup=true;
  save();
  el('setup').style.display='none';
  confetti(80);sfxFanfare();
  cheer('⚡','欢迎来到成长积分银行！');
  speak('欢迎'+name+'！开始今天的任务吧！');
  toast('🎉 欢迎 '+name+'！开始今天的任务吧');
  renderAll();
}

/* ================= 启动 ================= */
function healCheck(){
  const tip=el('previewTip');
  if(tip.hidden)return;
  function recovered(){
    tip.hidden=true;tip.style.display='none';save();
    toast('✅ 存储已恢复，刚才打的卡已自动保存',3400);
  }
  store.recheck();
  if(store.ls()||store.hasDB()){recovered();return}
  store.retryDB(function(ok){if(ok)recovered()});
}
function init(){
  if(!S.setup){el('setup').style.display='flex';renderSetup()}
  setView('home');
  store.boot(function(idbRaw){
    if(!_ls0&&idbRaw){
      try{
        const d=normalize(JSON.parse(idbRaw));
        if(d){
          S=d;setupAv=kid().avatar||'🦸';
          if(S.setup)el('setup').style.display='none';
          else{el('setup').style.display='flex';renderSetup()}
          renderAll();
        }
      }catch(e){}
    }
    if(!store.ls()&&!store.hasDB()){
      const tip0=el('previewTip');
      tip0.hidden=false;tip0.style.display='flex';
      const dg=store.diag(),dl=el('diagLine');
      if(dl)dl.textContent='诊断 ▸ 存储A：'+(dg.ls?'正常':'失败（'+dg.lsErr+'）')+'　存储B：'+(dg.db?'正常':'失败（'+dg.dbErr+'）');
    }
    save();
  });
  setInterval(function(){
    if(_day!==today()){_day=today();renderAll()}
    healCheck();
  },30000);
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden){
      if(_day!==today())_day=today();
      renderAll();healCheck();
    }
  });
}
init();
</script>
</body>
</html>
